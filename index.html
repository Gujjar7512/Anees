<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anees × Kuchu Puchu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#07141a;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,
    rgba(255,70,140,.20),transparent 65%);
    top:-150px;
    left:-150px;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,
    rgba(120,80,255,.18),transparent 65%);
    bottom:-180px;
    right:-150px;
}

.wrapper{
    width:min(92%,420px);
    text-align:center;
    position:relative;
    z-index:2;
}

.title{
    font-size:clamp(30px,9vw,46px);
    font-weight:800;
    margin-bottom:20px;
}

.title span{
    color:#baff35;
}

/* CARD */
.card{
    background:white;
    color:#111;
    border-radius:8px;
    padding:25px 18px 32px;
    min-height:500px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
    overflow:hidden;
    position:relative;
}

/* ---------------- BEAR ---------------- */

.bear-area{
    height:175px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    margin-bottom:5px;
}

.bear{
    width:125px;
    height:125px;
    background:#c98d5b;
    border-radius:48% 48% 45% 45%;
    position:relative;
    animation:bounceBear 2s ease-in-out infinite;
    box-shadow:inset -7px -8px 0 rgba(0,0,0,.08);
}

/* ears */
.ear{
    position:absolute;
    width:43px;
    height:43px;
    background:#b8794c;
    border-radius:50%;
    top:-16px;
    z-index:-1;
}

.ear.left{
    left:-8px;
}

.ear.right{
    right:-8px;
}

.ear::after{
    content:"";
    position:absolute;
    width:25px;
    height:25px;
    background:#e8b08a;
    border-radius:50%;
    top:9px;
    left:9px;
}

/* eyes */
.eye{
    position:absolute;
    width:11px;
    height:13px;
    background:#24170f;
    border-radius:50%;
    top:45px;
    animation:blink 4s infinite;
}

.eye.left{
    left:34px;
}

.eye.right{
    right:34px;
}

@keyframes blink{
    0%,44%,48%,100%{
        transform:scaleY(1);
    }
    46%{
        transform:scaleY(.1);
    }
}

/* muzzle */
.muzzle{
    position:absolute;
    width:55px;
    height:42px;
    background:#efc29d;
    border-radius:50%;
    left:35px;
    top:62px;
}

.nose{
    position:absolute;
    width:17px;
    height:12px;
    background:#382116;
    border-radius:50%;
    left:19px;
    top:7px;
}

.mouth{
    position:absolute;
    width:18px;
    height:9px;
    border-bottom:3px solid #382116;
    border-radius:50%;
    left:18px;
    top:17px;
}

/* blush */
.blush{
    position:absolute;
    width:18px;
    height:9px;
    background:#ef8e8e;
    opacity:.55;
    border-radius:50%;
    top:72px;
}

.blush.left{
    left:15px;
}

.blush.right{
    right:15px;
}

/* arms */
.arm{
    position:absolute;
    width:42px;
    height:25px;
    background:#c98d5b;
    border-radius:50%;
    top:76px;
}

.arm.left{
    left:-27px;
    transform:rotate(25deg);
}

.arm.right{
    right:-27px;
    transform:rotate(-25deg);
}

/* heart */
.bear-heart{
    position:absolute;
    font-size:47px;
    left:39px;
    top:72px;
    z-index:3;
    animation:heartBeat 1.1s infinite;
}

@keyframes heartBeat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.16)}
}

@keyframes bounceBear{
    0%,100%{
        transform:translateY(0) rotate(0);
    }
    50%{
        transform:translateY(-9px) rotate(1deg);
    }
}

/* little floating hearts around bear */
.bear-heart-float{
    position:absolute;
    font-size:18px;
    animation:floatHeart 2.5s infinite ease-in-out;
}

.h1{
    left:15px;
    top:20px;
}

.h2{
    right:15px;
    top:40px;
    animation-delay:.7s;
}

.h3{
    right:25px;
    top:105px;
    animation-delay:1.2s;
}

@keyframes floatHeart{
    0%,100%{
        transform:translateY(5px) scale(.8);
        opacity:.5;
    }
    50%{
        transform:translateY(-12px) scale(1);
        opacity:1;
    }
}

/* ---------------- TEXT ---------------- */

.small{
    font-size:14px;
    color:#777;
    margin-bottom:9px;
}

.question{
    font-size:30px;
    font-weight:800;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:18px;
}

button{
    border:0;
    border-radius:25px;
    padding:13px 27px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

#yes{
    background:#ff4d9a;
    color:white;
    box-shadow:0 8px 20px rgba(255,77,154,.35);
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#eee;
    color:#555;
}

/* ---------------- SURPRISE ---------------- */

#surprise{
    display:none;
    animation:pop .7s ease;
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.surprise-bear{
    font-size:90px;
    animation:bounceBear 1.5s infinite;
    margin-bottom:12px;
}

.surprise-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:13px;
}

.message{
    color:#555;
    font-size:17px;
    line-height:1.6;
}

.signature{
    margin-top:20px;
    color:#ff4d9a;
    font-weight:bold;
}

/* floating hearts */
.heart{
    position:fixed;
    bottom:-30px;
    font-size:22px;
    pointer-events:none;
    animation:floatUp 4s linear forwards;
    z-index:10;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) scale(.7);
        opacity:0;
    }
    15%{opacity:1}
    100%{
        transform:
        translateY(-110vh)
        translateX(var(--move))
        rotate(25deg);
        opacity:0;
    }
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#8b969b;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="title">
    <span>Anees</span> × Kuchu Puchu ❤️
</div>

<div class="card">

<!-- QUESTION -->
<div id="questionBox">

    <div class="bear-area">

        <div class="bear-heart-float h1">💕</div>
        <div class="bear-heart-float h2">✨</div>
        <div class="bear-heart-float h3">💗</div>

        <div class="bear">

            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="blush left"></div>
            <div class="blush right"></div>

            <div class="muzzle">
                <div class="nose"></div>
                <div class="mouth"></div>
            </div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="bear-heart">❤️</div>

        </div>

    </div>

    <div class="small">
        Kuchu Puchu, ek chhota sa sawaal... 🥺
    </div>

    <div class="question">
        Do you love me? ❤️
    </div>

    <div class="buttons">

        <button id="yes" onclick="sayYes()">
            YES ❤️
        </button>

        <button id="no" onclick="moveNo()">
            NO 😜
        </button>

    </div>

</div>


<!-- SURPRISE -->
<div id="surprise">

    <div class="surprise-bear">
        🧸💖
    </div>

    <div class="surprise-title">
        I knew it! 😭❤️
    </div>

    <div class="message">

        Kuchu Puchu, tum bohat special ho. 🥹

        <br><br>

        Bas hamesha khush rehna,
        smile karti rehna aur
        apni cute si vibes kabhi mat khona. ❤️

    </div>

    <div class="signature">
        — Always, Anees ❤️
    </div>

</div>

</div>

<div class="footer">
    Made with ❤️ specially for Kuchu Puchu
</div>

</div>


<script>

function moveNo(){

    const btn = document.getElementById("no");

    const maxX = window.innerWidth - 120;
    const maxY = window.innerHeight - 70;

    const x = Math.max(10, Math.random()*maxX);
    const y = Math.max(10, Math.random()*maxY);

    btn.style.position = "fixed";
    btn.style.left = x + "px";
    btn.style.top = y + "px";

    createHeart();
}


function sayYes(){

    document.getElementById("questionBox").style.display="none";

    document.getElementById("surprise").style.display="block";

    for(let i=0;i<45;i++){

        setTimeout(createHeart,i*70);

    }
}


function createHeart(){

    const heart=document.createElement("div");

    const hearts=[
        "❤️",
        "💖",
        "💕",
        "💗",
        "💓",
        "🥰",
        "✨",
        "🧸"
    ];

    heart.className="heart";

    heart.innerHTML=
        hearts[Math.floor(Math.random()*hearts.length)];

    heart.style.left=
        Math.random()*100+"vw";

    heart.style.setProperty(
        "--move",
        (Math.random()*160-80)+"px"
    );

    heart.style.animationDuration=
        (3+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}


setInterval(()=>{
    createHeart();
},1300);

</script>

</body>
  </html>
